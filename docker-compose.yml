version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=TreeBench_StrongPass123!
    ports:
      - "1433:1433"
    networks:
      - treebench-network

  api:
    build:
      context: .
      dockerfile: TreeBench.API/Dockerfile
    ports:
      - "5174:5174"
    environment:
      - DB_CONNECTION_STRING=Server=db;Database=TreeBenchDB;User Id=sa;Password=TreeBench_StrongPass123!;TrustServerCertificate=True;
    depends_on:
      - db
    networks:
      - treebench-network

  ui:
    build:
      context: .
      dockerfile: TreeBench.UI/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - treebench-network

networks:
  treebench-network:
    driver: bridge